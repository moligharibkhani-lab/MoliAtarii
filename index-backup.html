<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoliAtari</title>

<style>
body {
    margin: 0;
    background: #080d20;
    color: white;
    font-family: Arial;
    text-align: center;
}

h2 { color: #38d9ff; }

canvas {
    background: #101a35;
    border: 2px solid #38d9ff;
    border-radius: 12px;
    max-width: 95%;
}
</style>
</head>

<body>

<h2>🚀 MoliAtari</h2>
<p>امتیاز: <span id="score">0</span></p>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 180, y: 520, size: 30 };
let bullets = [];
let enemies = [];
let score = 0;

let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function shoot() {
    bullets.push({ x: player.x + 13, y: player.y });
}

setInterval(shoot, 350);

setInterval(() => {
    enemies.push({
        x: Math.random() * 360,
        y: -30,
        size: 30,
        speed: 2 + Math.random() * 2
    });
}, 1000);

function drawPlayer() {
    ctx.fillStyle = "#38d9ff";
    ctx.fillText("🚀", player.x, player.y + 25);
}

function update() {
    ctx.clearRect(0, 0, 400, 600);

    if (keys["ArrowLeft"] && player.x > 0) player.x -= 5;
    if (keys["ArrowRight"] && player.x < 365) player.x += 5;

    drawPlayer();

    ctx.fillStyle = "#ffe66d";

    bullets.forEach((b, i) => {
        b.y -= 7;
        ctx.fillRect(b.x, b.y, 5, 12);
        if (b.y < 0) bullets.splice(i, 1);
    });

    enemies.forEach((e, i) => {
        e.y += e.speed;

        ctx.font = "25px Arial";
        ctx.fillText("👾", e.x, e.y);

        bullets.forEach((b, j) => {
            if (Math.abs(b.x - e.x) < 25 &&
                Math.abs(b.y - e.y) < 25) {
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                score += 10;
                document.getElementById("score").textContent = score;
            }
        });
    });

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
